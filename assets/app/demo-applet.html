<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הדמיה לדוגמה</title>
<style>
  /* Applets load the lomda's own font files; nothing comes from the internet. */
  @font-face { font-family: 'Assistant'; src: url('../fonts/Assistant-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'Assistant'; src: url('../fonts/Assistant-Bold.ttf') format('truetype'); font-weight: 700; }
  html, body { margin: 0; height: 100%; font-family: 'Assistant', sans-serif; direction: rtl; background: #f4f8fb; }
  button, input { font-family: inherit; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 28px; padding-top: 60px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 44px; color: #17165B; line-height: 1.3; }
  .tank { width: 220px; height: 320px; border: 5px solid #17165B; border-top: none; border-radius: 0 0 24px 24px; position: relative; overflow: hidden; background: #fff; }
  .water { position: absolute; bottom: 0; left: 0; right: 0; height: 0; background: #299FD4; transition: height 4s linear; }
  .run .water { height: 85%; }
  .controls { display: flex; gap: 18px; }
  button { font-size: 30px; font-weight: 700; padding: 12px 34px; border: none; border-radius: 16px; background: #404040; color: #FFF8E6; cursor: pointer; }
  button:focus-visible { outline: 3px solid #299FD4; outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>הדמיה לדוגמה</h1>
  <div class="tank" aria-hidden="true"><div class="water"></div></div>
  <div class="controls">
    <button type="button" id="start">הפעלה</button>
    <button type="button" id="reset">איפוס</button>
  </div>
</div>
<script>
  'use strict';
  // Tell the lomda the learner started the applet: the forward arrow appears
  // a set number of seconds after this (data-arrow-after on the screen).
  document.getElementById('start').addEventListener('click', function () {
    document.getElementById('wrap').classList.add('run');
    try { window.parent.postMessage({ type: 'APPLET_STARTED' }, '*'); } catch (e) {}
  });
  document.getElementById('reset').addEventListener('click', function () {
    document.getElementById('wrap').classList.remove('run');
  });
</script>
</body>
</html>
